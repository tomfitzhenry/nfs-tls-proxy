[package]
name = "nfs-tls-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tls-parser = "0.11"
nom = "7"
tokio-splice2 = "0.3"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
byteorder = "1.4"
log = "0.4"
bytes = "1.0"
env_logger = "0.10"

[dev-dependencies]
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1.0"
rcgen = "0.11"
rustls-pemfile = "2.0"
